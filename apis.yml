aid: percipient-ai
name: Percipient.ai
description: 'Percipient.ai is a Silicon Valley artificial intelligence, machine learning and computer
  vision company, founded in 2017 by Founder & CEO Balan Ayyar, that builds Mirage - an intelligence analysis
  platform for United States national security and intelligence missions. Mirage performs faster-than-real-time
  exploitation of unstructured multimedia, visual and multi-INT data across three modules: an FMV module
  for full motion video, still imagery and multi-INT sensor data supporting identity creation, network
  discovery, pattern-of-life analysis and geo-correlation; a cloud GSM geospatial module providing geo-fenced
  alerting, change detection, custom object detection and temporal analysis; and a VRM vehicle recognition
  module delivered as a mobile appliance for mobile and fixed surveillance with home-station cross-mission
  correlation. The platform is deployed both at the edge for live stream ingest and in the cloud at petabyte
  scale, and has been operationally procured by organizations in the US Intelligence Community and the
  National Geospatial-Intelligence Agency. Percipient.ai sells Mirage through federal contracting vehicles
  and is listed as Awardable on the CDAO Tradewinds Solutions Marketplace. It operates no public developer
  program: as of August 2026 it publishes no API, developer portal, API reference, SDK or machine-readable
  contract of any kind.'
